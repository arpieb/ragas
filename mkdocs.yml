# Pages deliberately kept out of the sidebar. Declaring them here is what lets
# `mkdocs build --strict` pass: without it mkdocs emits one "pages exist in the
# docs directory but are not included in nav" warning covering all of them,
# which would also mask a genuinely orphaned new page.
not_in_nav: |
  # Snippet partials -- included into other pages via `--8<--`, never standalone.
  extra/components/choose_evaluator_llm.md
  extra/components/choose_generator_llm.md
  howtos/customizations/metrics/_cost.md

  # Unmaintained integration pages, superseded or never linked from anywhere.
  # _ag_ui.md and _haystack.md are older copies of ag_ui.md / haystack.md.
  howtos/integrations/_ag_ui.md
  howtos/integrations/_athina.md
  howtos/integrations/_haystack.md
  howtos/integrations/_helicone.md
  howtos/integrations/_langfuse.md
  howtos/integrations/_tonic-validate.md
  howtos/integrations/_zeno.md

  # Stubs and internal notes, not user-facing documentation.
  community/pdf_export.md
  concepts/feedback/index.md
  quoted_spans_metric.md

# https://www.mkdocs.org/user-guide/configuration/#validation
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

# Material-Docs Theme
theme:
  name: material
  custom_dir: docs/extra/overrides
  logo: _static/imgs/ragas-logo.png
  favicon: _static/favicon.ico
  features:
    - announce.dismiss
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "#bd8526"
      accent: "#bd8526"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "#bd8526"
      accent: "#bd8526"
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["./docs/extra/components/"]

# Extra CSS
extra_css:
  - extra/ragas-modern.css

# Plugins
extra:
  version:
    provider: mike
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
plugins:
  - search
  - social:
      enabled: !ENV [MKDOCS_CI, true]
  - copy-to-llm:
      repo_url: "https://raw.githubusercontent.com/vibrantlabsai/ragas/main/docs"
      buttons:
        copy_page: true
        copy_markdown_link: false  # Disabled until plugin bug is fixed
        view_as_markdown: false    # Disabled until plugin bug is fixed
        open_in_chatgpt: true
        open_in_claude: true
  - llmstxt:
      markdown_description: |
        Ragas is an open-source evaluation framework for LLM applications including RAG pipelines,
        AI agents, and workflows. It provides objective metrics for evaluation, test data generation
        capabilities, and integrations with popular LLM frameworks like LangChain and LlamaIndex.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - getstarted/*.md
        Tutorials:
          - tutorials/*.md
        Core Concepts:
          - concepts/*.md
          - concepts/components/*.md
        Metrics:
          - concepts/metrics/overview/*.md
          - concepts/metrics/available_metrics/*.md
        Test Data Generation:
          - concepts/test_data_generation/*.md
        Customization Guides:
          - howtos/customizations/*.md
          - howtos/customizations/metrics/*.md
          - howtos/customizations/testgenerator/*.md
          - howtos/customizations/optimizers/*.md
        Application Guides:
          - howtos/applications/*.md
        CLI:
          - howtos/cli/*.md
        Integrations:
          - howtos/integrations/*.md
        API Reference:
          - references/*.md
  - git-revision-date-localized:
      enabled: !ENV [MKDOCS_CI, false]
      enable_creation_date: true
  - git-committers:
      enabled: !ENV [MKDOCS_CI, false]
      repository: vibrantlabsai/ragas
      branch: main
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true
  - glightbox
  # - gen-files:
  #     scripts:
  #       - docs/ipynb_to_md.py
extra_javascript:
  - _static/js/mathjax.js
  - _static/js/header_border.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - _static/js/toggle.js
  - https://cdn.octolane.com/tag.js?pk=c7c9b2b863bf7eaf4e2a # octolane for analytics
  - _static/js/commonroom.js # commonroom analytics
