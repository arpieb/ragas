name: Upload ragas-examples Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi-release
    strategy:
      matrix:
        package:
          - name: ragas-examples
            directory: examples
            token: PYPI_API_TOKEN
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # setuptools_scm needs full history + tags to derive the version
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Show setuptools-scm version
      run: uv run --no-project --with "setuptools_scm[toml]" python -m setuptools_scm
      working-directory: ${{ matrix.package.directory }}
    - name: Build package
      run: uv build --out-dir dist
      working-directory: ${{ matrix.package.directory }}
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets[matrix.package.token] }}
        packages-dir: ${{ matrix.package.directory }}/dist/
        attestations: false


