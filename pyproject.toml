[project]
name = "ragas"
description = "Evaluation framework for RAG and LLM applications"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    # Core dependencies
    "numpy>=1.21.0,<3.0.0",
    "datasets>=4.0.0",
    "tiktoken",
    "pydantic>=2.0.0",
    "nest-asyncio",
    "appdirs",
    "diskcache>=5.6.3",
    "typer",
    "rich",
    "openai>=1.0.0",
    "tqdm",
    "instructor",
    "pillow>=10.4.0",
    "networkx",
    "scikit-network",

    # LangChain ecosystem.
    # Upper-bounded to the 0.x line: langchain 1.x / langchain-community 0.4 removed
    # `langchain_community.chat_models.vertexai`, which ragas.llms.base imports at
    # module scope, so `import ragas` fails outright against the 1.x line.
    "langchain-core<1.0.0",
    # Provider-neutral LLM/embedding access. embedding_factory() routes client-less
    # calls here, and it is the intended replacement for the LangChain adapters.
    "litellm",
]
dynamic = ["version", "readme"]

[project.urls]
Homepage = "https://github.com/vibrantlabsai/ragas"
Documentation = "https://docs.ragas.io"
Code = "https://github.com/vibrantlabsai/ragas"
Issues = "https://github.com/vibrantlabsai/ragas/issues"

[project.optional-dependencies]
# Core optional features
all = [
    "sentence-transformers",
    "transformers",
    "nltk",
    "rouge_score",
    "rapidfuzz",
    "pandas",
    "datacompy",
    "sacrebleu",
    "llama_index",
    "r2r",
    "GitPython"
]

# Specific integrations
git = ["GitPython"]
tracing = ["langfuse>=3.2.4", "mlflow>=3.1.4"]
gdrive = [
    "google-api-python-client>=2.178.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2"
]
# Bounded to haystack 2.x: 3.x moved `AsyncPipeline`, which
# ragas.llms.haystack_wrapper imports at module scope.
ai-frameworks = ["haystack-ai<3.0.0"]
oci = ["oci>=2.160.1"]
ag-ui = ["ag-ui-protocol>=0.1.9", "httpx>=0.27.0"]
dspy = ["dspy-ai>=2.4.0"]

[project.entry-points."ragas.backends"]
"local/csv" = "ragas.backends.local_csv:LocalCSVBackend"
"local/jsonl" = "ragas.backends.local_jsonl:LocalJSONLBackend"
"inmemory" = "ragas.backends.inmemory:InMemoryBackend"
"gdrive" = "ragas.backends.gdrive_backend:GDriveBackend"

[project.scripts]
ragas = "ragas.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["*.ipynb", "*/_version.py"]  # Exclude Jupyter notebooks and auto-generated version files from linting

[tool.ruff.lint]
select = ["E", "F", "I", "TID251"]
ignore = ["E501"]  # Line length handled by formatter

# LangChain removal ratchet: importing any langchain package is an error.
# Files still doing so are listed in [tool.ruff.lint.per-file-ignores] below,
# grouped by the migration stage that removes them. That list only shrinks.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain".msg = "ragas is removing LangChain. Use ragas-native APIs (see plan/migrate_off_langchain)."
"langchain_core".msg = "ragas is removing LangChain. Use ragas-native APIs (see plan/migrate_off_langchain)."
"langchain_community".msg = "ragas is removing LangChain. Use ragas-native APIs (see plan/migrate_off_langchain)."
"langchain_openai".msg = "ragas is removing LangChain. Use litellm/instructor providers instead."
"langchain_text_splitters".msg = "ragas is removing LangChain. Use ragas-native splitters."


[tool.ruff.lint.per-file-ignores]
# LangChain removal ratchet. Every entry is a file that still imports langchain.
# Entries are DELETED as each migration stage lands - this list must only shrink.
# When it is empty, delete it along with the banned-api block above.
