[project]
name = "ragas"
description = "Evaluation framework for RAG and LLM applications"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    # Core dependencies
    "numpy>=1.21.0,<3.0.0",
    "datasets>=4.0.0",
    "tiktoken",
    "pydantic>=2.0.0",
    "nest-asyncio",
    "appdirs",
    "diskcache>=5.6.3",
    "typer",
    "rich",
    "tqdm",
    "instructor",
    "pillow>=10.4.0",
    "networkx",
    "scikit-network",

    # Provider-neutral LLM/embedding access. llm_factory()/embedding_factory()
    # route client-less calls here.
    "litellm",
    # Tracing. The API package only -- spans are a no-op unless the user
    # configures an SDK, which is how a library should behave. EvaluationResult
    # .traces comes from the native run tree, so it works without one.
    "opentelemetry-api",
]
dynamic = ["version", "readme"]

[project.urls]
Homepage = "https://github.com/arpieb/ragas-ng"
Documentation = "https://github.com/arpieb/ragas-ng/tree/main/docs"
Code = "https://github.com/arpieb/ragas-ng"
Issues = "https://github.com/arpieb/ragas-ng/issues"

[project.optional-dependencies]
# Core optional features
all = [
    "sentence-transformers",
    "transformers",
    "nltk",
    "rouge_score",
    "rapidfuzz",
    "pandas",
    "datacompy",
    "sacrebleu",
    "llama_index",
    "r2r",
    "GitPython"
]

# Specific integrations
git = ["GitPython"]
tracing = ["langfuse>=3.2.4", "mlflow>=3.1.4"]
gdrive = [
    "google-api-python-client>=2.178.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2"
]
# Bounded to haystack 2.x: 3.x moved `AsyncPipeline`, which
# ragas.llms.haystack_wrapper imports at module scope.
ai-frameworks = ["haystack-ai<3.0.0"]
oci = ["oci>=2.160.1"]
ag-ui = ["ag-ui-protocol>=0.1.9", "httpx>=0.27.0"]
dspy = ["dspy-ai>=2.4.0"]

[project.entry-points."ragas.backends"]
"local/csv" = "ragas.backends.local_csv:LocalCSVBackend"
"local/jsonl" = "ragas.backends.local_jsonl:LocalJSONLBackend"
"inmemory" = "ragas.backends.inmemory:InMemoryBackend"
"gdrive" = "ragas.backends.gdrive_backend:GDriveBackend"

[project.scripts]
ragas = "ragas.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["*.ipynb", "*/_version.py"]  # Exclude Jupyter notebooks and auto-generated version files from linting

[tool.ruff.lint]
select = ["E", "F", "I", "TID251"]
ignore = ["E501"]  # Line length handled by formatter

# examples/ is linted for this ban only. It sat outside ruff's paths entirely
# until now, which is how four langchain imports survived the whole removal --
# `make format` ran on `src tests docs`. Bringing it fully under lint means 24
# pre-existing findings, 9 of them E402s that need judgement, so that is left as
# a separate decision; the ban is the part that matters here.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E", "F", "I"]

# LangChain is banned outright. No file in src, tests, docs or examples imports
# it. The ban stays: it is what stops one being reintroduced.
# tests/unit/test_langchain_boundary.py asserts the same thing at runtime.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain".msg = "ragas does not depend on LangChain. See docs/howtos/migrations/migrate_off_langchain.md."
"langchain_core".msg = "ragas does not depend on LangChain. See docs/howtos/migrations/migrate_off_langchain.md."
"langchain_community".msg = "ragas does not depend on LangChain. See docs/howtos/migrations/migrate_off_langchain.md."
"langchain_openai".msg = "ragas does not depend on LangChain. Use litellm/instructor providers instead."
"langchain_text_splitters".msg = "ragas does not depend on LangChain. Use ragas-native splitters."







[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["ragas"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false
preview = false

[tool.pyright]
include = ["src/ragas"]
exclude = ["@types/*"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = false
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportReturnType = "warning"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Path to version file relative to this pyproject.toml
version_file = "src/ragas/_version.py"

# UV Configuration
[tool.uv]
# `uv sync` / `uv run` install the fast minimal dev set by default.
# The full ML stack is opt-in via `uv sync --group dev` (see `make install`).
default-groups = ["dev-minimal"]

# UV Workspace Configuration
[tool.uv.workspace]
members = [".", "examples"]

# Workspace dependency sources
[tool.uv.sources]
ragas-examples = { workspace = true }

[tool.pytest.ini_options]
addopts = "-n 0"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
# Minimal dev dependencies for fast development setup (used by `make install-minimal`)
dev-minimal = [
    {include-group = "test"},
    "ruff>=0.16",
    "pyright>=1.1.403",
    "pre-commit>=4.3.0",
    "pytest",
    "pytest-xdist[psutil]",
    "pytest-asyncio",
    "nbmake",
    "build>=1.3.0",
]

# Dependencies required to run tests/unit. These are optional at runtime (they
# live in the `all`/`git`/`ai-frameworks` extras) but tests/unit imports them
# unconditionally, so the test suite cannot pass without them.
test = [
    "scipy",
    # ragas no longer declares openai -- it arrives via litellm/instructor -- but
    # the suite imports it directly (tests/utils/llm_setup.py and friends), so it
    # is declared here rather than relied on transitively.
    "openai>=1.0.0",
    "sacrebleu",   # tests/unit/test_chrf_score.py
    "GitPython",   # tests/unit/test_experiment.py
    "haystack-ai<3.0.0", # tests/unit/test_import.py
    "llama_index", # tests/unit/test_import.py
    "rapidfuzz",   # tests/unit/test_prechunked_generation.py
    # SDK is test-only: ragas itself depends on opentelemetry-api alone, so spans
    # are a no-op in production unless the user configures a provider. Tests need
    # a real provider + InMemorySpanExporter to assert the span tree.
    "opentelemetry-sdk",
]

# Full dev dependencies with all features (used by `make install`)
dev = [
    {include-group = "dev-minimal"},
    # Additional tools for full dev
    "notebook",
    "unstructured[md]",
    "arize-phoenix>=6.1.0",
    # Include all optional features
    "ragas[all,tracing,gdrive,ai-frameworks]",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material",
    "mkdocs-material[imaging]",
    "mkdocstrings[python]",
    "mkdocs-glightbox",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-copy-to-llm",
    "mkdocs-llmstxt",  # only used in docs CI
]

docs-pdf = [
    "mkdocs-to-pdf>=0.10.1",
    "mkdocs-mermaid-to-svg"
]